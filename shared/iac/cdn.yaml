AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  CloudFront + WAF front door for the internal Loom ALB via a VPC origin.
  MUST be deployed in us-east-1 (WAF CLOUDFRONT scope and the viewer ACM
  certificate both require us-east-1). The ALB stays private; CloudFront is
  the only public entry point.

Parameters:
  pAlbArn:
    Type: String
    Description: ARN of the internal ALB (loom-infra output oAlbArn)
  pPublicFqdn:
    Type: String
    Description: Public domain served by CloudFront (e.g. loom.example.com). Must match the ALB ACM cert for origin SNI.
  pHostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: Route 53 hosted zone ID for the public FQDN
  pCfCertArn:
    Type: String
    Description: ACM certificate ARN in us-east-1 covering pPublicFqdn (CloudFront viewer cert)
  pTagApplication:
    Type: String
    Description: Value for the loom:application tag
  pTagGroup:
    Type: String
    Description: Value for the loom:group tag
  pTagOwner:
    Type: String
    Description: Value for the loom:owner tag

Resources:
  # ---------------------------------------------------------------------------
  # WAF — attached to the CloudFront distribution (scope CLOUDFRONT, us-east-1)
  # ---------------------------------------------------------------------------
  WebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub "${AWS::StackName}-waf"
      Scope: CLOUDFRONT
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub "${AWS::StackName}-waf"
      Rules:
        - Name: AWSManagedCommon
          Priority: 0
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
              # The 8 KB body limit is re-applied by LargeBodyExceptUpload
              # below for every path except the authenticated upload route.
              RuleActionOverrides:
                - Name: SizeRestrictions_BODY
                  ActionToUse: { Count: {} }
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: common
        - Name: AWSManagedKnownBadInputs
          Priority: 1
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: known-bad-inputs
        - Name: LargeBodyExceptUpload
          Priority: 2
          Action:
            Block: {}
          Statement:
            AndStatement:
              Statements:
                - SizeConstraintStatement:
                    FieldToMatch:
                      Body: { OversizeHandling: MATCH }
                    ComparisonOperator: GT
                    Size: 8192
                    TextTransformations: [{ Priority: 0, Type: NONE }]
                - NotStatement:
                    Statement:
                      ByteMatchStatement:
                        FieldToMatch: { UriPath: {} }
                        PositionalConstraint: EXACTLY
                        SearchString: /api/claude/files
                        TextTransformations: [{ Priority: 0, Type: NONE }]
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: large-body-except-upload
      Tags:
        - Key: loom:application
          Value: !Ref pTagApplication
        - Key: loom:group
          Value: !Ref pTagGroup
        - Key: loom:owner
          Value: !Ref pTagOwner

  # ---------------------------------------------------------------------------
  # CloudFront VPC origin — private connection into the internal ALB
  # ---------------------------------------------------------------------------
  VpcOrigin:
    Type: AWS::CloudFront::VpcOrigin
    Properties:
      VpcOriginEndpointConfig:
        Name: !Sub "${AWS::StackName}-alb-origin"
        Arn: !Ref pAlbArn
        HTTPSPort: 443
        OriginProtocolPolicy: https-only
        OriginSSLProtocols:
          - TLSv1.2
      Tags:
        - Key: loom:application
          Value: !Ref pTagApplication
        - Key: loom:group
          Value: !Ref pTagGroup
        - Key: loom:owner
          Value: !Ref pTagOwner

  # ---------------------------------------------------------------------------
  # CloudFront distribution
  # ---------------------------------------------------------------------------
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "Loom front door (${pPublicFqdn})"
        HttpVersion: http2and3
        IPV6Enabled: true
        Aliases:
          - !Ref pPublicFqdn
        WebACLId: !GetAtt WebAcl.Arn
        ViewerCertificate:
          AcmCertificateArn: !Ref pCfCertArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: loom-alb
            # SNI sent to the ALB must match its ACM certificate.
            DomainName: !Ref pPublicFqdn
            VpcOriginConfig:
              VpcOriginId: !Ref VpcOrigin
        DefaultCacheBehavior:
          TargetOriginId: loom-alb
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          CachedMethods: [GET, HEAD]
          Compress: true
          # CachingDisabled — the app is dynamic (UI + API behind one ALB).
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          # AllViewer — forward all headers, cookies and query strings to the origin.
          OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3
      Tags:
        - Key: loom:application
          Value: !Ref pTagApplication
        - Key: loom:group
          Value: !Ref pTagGroup
        - Key: loom:owner
          Value: !Ref pTagOwner

  # ---------------------------------------------------------------------------
  # Route 53 — public FQDN alias to CloudFront
  # ---------------------------------------------------------------------------
  DnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref pHostedZoneId
      Name: !Ref pPublicFqdn
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        # Fixed hosted zone id for all CloudFront distributions.
        HostedZoneId: Z2FDTNDATAQYW2

Outputs:
  oDistributionId:
    Description: CloudFront distribution id
    Value: !Ref Distribution
  oCloudFrontDomain:
    Description: CloudFront distribution domain name
    Value: !GetAtt Distribution.DomainName
  oVpcOriginId:
    Description: >-
      CloudFront VPC origin id. After this stack is created, find the
      auto-generated CloudFront-VPCOrigins-Service-SG and pass its id back into
      loom-infra as pCloudFrontVpcOriginSgId to open the ALB ingress.
    Value: !Ref VpcOrigin
  oWebAclArn:
    Description: WAF WebACL ARN
    Value: !GetAtt WebAcl.Arn
